<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>جامع مدرسہ مینجمنٹ سسٹم — مین ڈیش بورڈ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#123a63;
    --navy-deep:#0c2745;
    --navy-ink:#0e2c4e;
    --gold:#c19a2e;
    --gold-soft:#f3e9cd;
    --bg:#eef1f6;
    --surface:#ffffff;
    --surface-2:#f7f9fc;
    --line:#dde4ee;
    --text:#182638;
    --muted:#5d6f86;
    --chip:#e8eef6;
    --shadow:0 1px 2px rgba(14,44,78,.06),0 6px 18px rgba(14,44,78,.06);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --navy:#2c5f96;
      --navy-deep:#0a1c31;
      --navy-ink:#dce9f7;
      --gold:#d4af37;
      --gold-soft:#3a331d;
      --bg:#0d1622;
      --surface:#152437;
      --surface-2:#1a2c44;
      --line:#2a3f5c;
      --text:#e8eff7;
      --muted:#9db1c8;
      --chip:#1e3350;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Noto Naskh Arabic","Noto Nastaliq Urdu",serif;
    background:var(--bg);
    color:var(--text);
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1240px;margin:0 auto;padding:14px 16px 22px}

  /* ---------- Header ---------- */
  header.topbar{
    background:linear-gradient(180deg,var(--navy),var(--navy-deep));
    color:#fff;
    border-radius:16px;
    padding:12px 18px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    box-shadow:var(--shadow);
    border-bottom:3px solid var(--gold);
  }
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:52px;height:52px;flex:0 0 auto;border-radius:50%;
    background:rgba(255,255,255,.1);
    border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
  }
  .logo svg{width:28px;height:28px;stroke:var(--gold)}
  .brand h1{
    font-family:"Noto Nastaliq Urdu",serif;
    font-size:1.28rem;font-weight:700;margin:0;line-height:2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .brand .sysname{font-size:.8rem;color:#c8d8ec;margin-top:-6px}
  .topbar .spacer{flex:1}
  .datebox{text-align:center;color:#dbe7f5;font-size:.86rem;line-height:1.5}
  .datebox .hijri{color:var(--gold);font-weight:600}
  .icon-btn{
    position:relative;width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);
    color:#fff;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:rgba(255,255,255,.18)}
  .icon-btn svg{width:20px;height:20px}
  .userchip{
    display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);border-radius:999px;
    padding:5px 6px 5px 14px;color:#fff;text-align:right;
  }
  .avatar{
    width:34px;height:34px;border-radius:50%;background:var(--gold);color:#231a02;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;flex:0 0 auto;
  }
  .userchip .uname{font-weight:700;font-size:.92rem;line-height:1.3}
  .userchip .urole{font-size:.74rem;color:#c8d8ec;line-height:1.3}
  .menu-wrap{position:relative}
  .dropdown{
    position:absolute;top:calc(100% + 8px);left:0;min-width:210px;z-index:40;
    background:var(--surface);color:var(--text);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 14px 34px rgba(10,30,55,.22);padding:6px;display:none;
  }
  .dropdown.open{display:block}
  .dropdown button,.dropdown .dd-item{
    display:flex;align-items:center;gap:9px;width:100%;text-align:right;
    background:none;border:none;padding:9px 10px;border-radius:8px;
    font-size:.9rem;color:var(--text);
  }
  .dropdown button:hover{background:var(--surface-2)}
  .dropdown svg{width:17px;height:17px;stroke:var(--navy);flex:0 0 auto}
  .dropdown .dd-empty{padding:12px 10px;font-size:.88rem;color:var(--muted);text-align:center}
  .dropdown .dd-head{padding:8px 10px 4px;font-size:.78rem;color:var(--muted)}

  /* ---------- Stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
  .stat{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 16px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);
  }
  .stat .sic{
    width:44px;height:44px;flex:0 0 auto;border-radius:12px;background:var(--chip);
    display:flex;align-items:center;justify-content:center;
  }
  .stat .sic svg{width:23px;height:23px;stroke:var(--navy)}
  .stat .slabel{font-size:.84rem;color:var(--muted)}
  .stat .svalue{font-size:1.45rem;font-weight:700;color:var(--navy-ink);line-height:1.25}
  .stat .snote{font-size:.72rem;color:var(--muted)}

  /* ---------- Groups ---------- */
  section.group{margin-top:16px}
  .g-head{display:flex;align-items:center;gap:10px;margin:0 2px 9px}
  .g-head h2{
    font-family:"Noto Nastaliq Urdu",serif;font-size:1.02rem;font-weight:700;
    color:var(--navy-ink);margin:0;line-height:1.9;
  }
  .g-head .g-ic{width:30px;height:30px;border-radius:9px;background:var(--navy);display:flex;align-items:center;justify-content:center}
  .g-head .g-ic svg{width:17px;height:17px;stroke:#fff}
  .g-head::after{content:"";flex:1;height:1px;background:var(--line)}
  .tiles{display:grid;gap:9px}
  .tiles.c5{grid-template-columns:repeat(5,1fr)}
  .tiles.c6{grid-template-columns:repeat(6,1fr)}
  .split{display:grid;grid-template-columns:2fr 1fr;gap:22px}
  .split .tiles.c3{grid-template-columns:repeat(3,1fr)}
  .split .tiles.c1{grid-template-columns:1fr}
  .tile{
    display:flex;align-items:center;gap:10px;text-align:right;width:100%;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;min-height:56px;box-shadow:0 1px 2px rgba(14,44,78,.05);
    transition:border-color .15s ease, transform .15s ease;
  }
  .tile:hover{border-color:var(--gold);transform:translateY(-1px)}
  .tile:focus-visible,.icon-btn:focus-visible,.userchip:focus-visible,.back-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .tile .tic{
    width:36px;height:36px;flex:0 0 auto;border-radius:10px;background:var(--chip);
    display:flex;align-items:center;justify-content:center;
  }
  .tile .tic svg{width:19px;height:19px;stroke:var(--navy)}
  .tile .tlabel{font-size:.93rem;font-weight:600;color:var(--text);line-height:1.45}
  .tile .chev{margin-inline-start:auto;color:var(--muted);flex:0 0 auto}
  .tile .chev svg{width:15px;height:15px;stroke:currentColor}

  footer.foot{
    margin-top:18px;text-align:center;color:var(--muted);font-size:.8rem;
  }
  footer.foot .gold{color:var(--gold)}

  /* ---------- Module page ---------- */
  .module-view{display:none}
  .module-view.open{display:block}
  .mod-card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:26px 22px;margin-top:14px;text-align:center;
  }
  .mod-card .m-ic{
    width:64px;height:64px;margin:0 auto 10px;border-radius:18px;background:var(--chip);
    display:flex;align-items:center;justify-content:center;
  }
  .mod-card .m-ic svg{width:32px;height:32px;stroke:var(--navy)}
  .mod-card h2{font-family:"Noto Nastaliq Urdu",serif;font-size:1.35rem;margin:0 0 4px;color:var(--navy-ink);line-height:2}
  .mod-card .m-group{color:var(--gold);font-weight:700;font-size:.85rem}
  .mod-card .m-desc{color:var(--muted);max-width:520px;margin:8px auto 4px;font-size:.95rem}
  .mod-card .m-state{
    display:inline-block;margin-top:14px;background:var(--gold-soft);color:var(--text);
    border:1px dashed var(--gold);border-radius:999px;padding:6px 18px;font-size:.88rem;font-weight:600;
  }
  .back-btn{
    display:inline-flex;align-items:center;gap:8px;margin-top:16px;
    background:var(--navy);color:#fff;border:none;border-radius:10px;
    padding:10px 20px;font-size:.95rem;font-weight:600;
  }
  .back-btn:hover{background:var(--navy-deep)}
  .back-btn svg{width:17px;height:17px;stroke:#fff}
  .profile-rows{max-width:420px;margin:14px auto 0;text-align:right}
  .profile-rows .row{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:.93rem}
  .profile-rows .row span:first-child{color:var(--muted)}
  .profile-rows .row span:last-child{font-weight:700}

  @media (max-width:900px){
    .tiles.c5{grid-template-columns:repeat(3,1fr)}
    .tiles.c6{grid-template-columns:repeat(3,1fr)}
    .split{grid-template-columns:1fr;gap:0}
  }
  @media (max-width:640px){
    .wrap{padding:8px 10px 14px}
    .stats{grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
    .tiles.c5,.tiles.c6,.split .tiles.c3,.split .tiles.c1{grid-template-columns:repeat(2,1fr)}
    .tiles{gap:6px}
    .brand{gap:9px}
    .logo{width:38px;height:38px}
    .logo svg{width:20px;height:20px}
    .brand h1{font-size:.92rem;white-space:normal;line-height:1.75}
    .brand .sysname{font-size:.66rem;margin-top:-2px}
    .datebox{order:5;width:100%;text-align:right;font-size:.76rem;display:flex;gap:10px;flex-wrap:wrap}
    header.topbar{padding:9px 12px;gap:8px}
    .userchip{padding:4px 5px 4px 10px;gap:7px}
    .userchip .uname{font-size:.8rem}
    .userchip .urole{font-size:.64rem}
    .avatar{width:28px;height:28px;font-size:.85rem}
    .icon-btn{width:36px;height:36px}
    .stat{flex-direction:column;padding:7px 3px;gap:2px;text-align:center}
    .stat>div{text-align:center}
    .stat .sic{width:28px;height:28px;border-radius:8px}
    .stat .sic svg{width:15px;height:15px}
    .stat .slabel{font-size:.66rem;line-height:1.35}
    .stat .svalue{font-size:1.05rem;line-height:1.2}
    .stat .snote{display:none}
    section.group{margin-top:10px}
    .g-head{margin-bottom:5px}
    .g-head h2{font-size:.88rem;line-height:1.6}
    .g-head .g-ic{width:24px;height:24px;border-radius:7px}
    .g-head .g-ic svg{width:13px;height:13px}
    .tile{min-height:40px;padding:5px 8px;gap:7px;border-radius:10px}
    .tile .tic{width:26px;height:26px;border-radius:7px}
    .tile .tic svg{width:14px;height:14px}
    .tile .tlabel{font-size:.79rem;line-height:1.35}
    .tile .chev{display:none}
    footer.foot{margin-top:12px;font-size:.72rem}
  }
  @media (prefers-reduced-motion: reduce){
    .tile{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== Dashboard view ===== -->
  <div id="dashboardView">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <div>
          <h1>مدرسہ سیدہ عائشہ صدیقہ <span style="font-size:.72em">(رضی اللہ عنہا)</span> للبنات</h1>
          <div class="sysname">جامع مدرسہ مینجمنٹ سسٹم — مین ڈیش بورڈ</div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="datebox">
        <div id="dateGregorian">—</div>
        <div class="hijri" id="dateHijri"></div>
      </div>
      <div class="menu-wrap">
        <button class="icon-btn" id="bellBtn" aria-label="اطلاعات" aria-haspopup="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </button>
        <div class="dropdown" id="bellMenu" role="menu">
          <div class="dd-head">اطلاعات</div>
          <div class="dd-empty">اس وقت کوئی نئی اطلاع موجود نہیں ہے۔</div>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="userchip" id="userBtn" aria-haspopup="true" aria-label="صارف کا مینو">
          <span class="avatar" aria-hidden="true">ح</span>
          <span class="umeta">
            <span class="uname">حمید</span><br />
            <span class="urole">سپر ایڈمن</span>
          </span>
        </button>
        <div class="dropdown" id="userMenu" role="menu">
          <div class="dd-head">حمید — سپر ایڈمن</div>
          <button type="button" data-open="profile">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            میرا پروفائل
          </button>
          <button type="button" data-open="users">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            صارفین اور اکاؤنٹس
          </button>
          <button type="button" data-open="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            نظام کی ترتیبات
          </button>
        </div>
      </div>
    </header>

    <!-- Stats: empty state (no records yet) -->
    <div class="stats" id="statsRow"></div>

    <!-- Groups rendered by script -->
    <div id="groupsRoot"></div>

    <footer class="foot">
      مدرسہ سیدہ عائشہ صدیقہ <span class="gold">(رضی اللہ عنہا)</span> للبنات — شادی لارج، ضلع بدین، سندھ
    </footer>
  </div>

  <!-- ===== Module view ===== -->
  <div class="module-view" id="moduleView">
    <div class="mod-card">
      <div class="m-ic" id="modIcon"></div>
      <div class="m-group" id="modGroup"></div>
      <h2 id="modTitle"></h2>
      <p class="m-desc" id="modDesc"></p>
      <div id="modExtra"></div>
      <div><span class="m-state">یہ شعبہ زیرِ تعمیر ہے — اگلے مرحلے میں مکمل تیار کیا جائے گا</span></div>
      <button class="back-btn" id="backBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        واپس مین ڈیش بورڈ
      </button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ---------- Icons (simple line icons) ---------- */
  function svg(paths){ return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>'; }
  var I = {
    users: svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
    userPlus: svg('<path d="M2 21a8 8 0 0 1 13.3-5.1"/><circle cx="10" cy="8" r="5"/><path d="M19 16v6"/><path d="M22 19h-6"/>'),
    idCard: svg('<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16.5c.6-1.4 1.7-2 3-2s2.4.6 3 2"/><path d="M15 9h4"/><path d="M15 13h4"/>'),
    teacher: svg('<path d="M22 9 12 4 2 9l10 5 10-5z"/><path d="M6 11.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"/><path d="M22 9v5"/>'),
    staff: svg('<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>'),
    classes: svg('<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-4h6v4"/><path d="M9 10h.01"/><path d="M15 10h.01"/><path d="M12 13h.01"/>'),
    checkCal: svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/>'),
    clockCheck: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    book: svg('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'),
    award: svg('<circle cx="12" cy="8" r="6"/><path d="M15.5 13 17 22l-5-3-5 3 1.5-9"/>'),
    income: svg('<path d="M12 2v20"/><path d="M17 6.5c-.8-1-2.6-1.5-5-1.5-3 0-5 1.3-5 3.2 0 4.4 10 2.4 10 6.6 0 1.9-2 3.2-5 3.2-2.4 0-4.2-.6-5-1.7"/>'),
    expense: svg('<path d="M3 6h18l-1.5 9h-13z"/><path d="M3 6l-1-3"/><circle cx="7" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/>'),
    monthCalc: svg('<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8"/><path d="M8 11h.01"/><path d="M12 11h.01"/><path d="M16 11h.01"/><path d="M8 15h.01"/><path d="M12 15h.01"/><path d="M16 15h.01"/>'),
    yearChart: svg('<path d="M3 3v18h18"/><path d="M8 17v-6"/><path d="M13 17V7"/><path d="M18 17v-9"/>'),
    zakat: svg('<path d="M12 21s-7.5-4.6-7.5-10A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 7.5 4c0 5.4-7.5 10-7.5 10z"/>'),
    gift: svg('<rect x="3" y="8" width="18" height="4"/><path d="M12 8v13"/><path d="M19 12v9H5v-9"/><path d="M12 8s-4 .2-5.5-1.2A2.3 2.3 0 0 1 8.5 3C11 3 12 8 12 8z"/><path d="M12 8s4 .2 5.5-1.2A2.3 2.3 0 0 0 15.5 3C13 3 12 8 12 8z"/>'),
    support: svg('<path d="M11 15H6a3 3 0 0 1 0-6h13"/><path d="M18 9a3 3 0 0 1 0 6h-1"/><circle cx="8.5" cy="12" r="1"/>'),

    general: svg('<path d="M3 21h18"/><path d="M6 21V8l6-5 6 5v13"/><path d="M10 21v-5h4v5"/>'),

    bell: svg('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>'),
    folder: svg('<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>'),
    backup: svg('<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>'),
    settings: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
    wallet: svg('<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>'),
    chev: svg('<path d="m14 7-5 5 5 5"/>'),
    gradCap: svg('<path d="M22 9 12 4 2 9l10 5 10-5z"/><path d="M6 11.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"/>'),
    coins: svg('<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>'),
    building: svg('<rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/><path d="M12 14h.01"/>')
  };

  /* ---------- Data: groups & modules (phase 1: navigation only) ---------- */
  var GROUPS = [
    { id:"edu", title:"تعلیمی شعبہ", icon:"gradCap", layout:"c5", modules:[
      { id:"students",       label:"طلبہ کا ریکارڈ",      icon:"users",    desc:"تمام طلبہ کی مکمل تفصیلات، رجسٹریشن نمبر اور سابقہ ریکارڈ یہاں محفوظ ہوگا۔" },
      { id:"admissions",     label:"نئے داخلے",          icon:"userPlus", desc:"نئے طلبہ کے داخلے، داخلہ فارم اور اندراج کا مکمل نظام یہاں ہوگا۔" },
      { id:"idcards",        label:"طلبہ کے شناختی کارڈ", icon:"idCard",   desc:"طلبہ کے شناختی کارڈ کی تیاری اور پرنٹ کی سہولت یہاں فراہم کی جائے گی۔" },
      { id:"teachers",       label:"اساتذہ کا ریکارڈ",   icon:"teacher",  desc:"اساتذہ کی تفصیلات، تقرری اور تدریسی ذمہ داریوں کا ریکارڈ یہاں ہوگا۔" },
      { id:"staff",          label:"عملے کا ریکارڈ",    icon:"staff",    desc:"غیر تدریسی عملے کی تفصیلات اور ذمہ داریوں کا ریکارڈ یہاں ہوگا۔" },
      { id:"classes",        label:"درجات اور جماعتیں",  icon:"classes",  desc:"درجات، جماعتوں اور شعبہ جات (حفظ، ناظرہ، درسِ نظامی) کی ترتیب یہاں ہوگی۔" },
      { id:"att-students",   label:"طلبہ کی حاضری",    icon:"checkCal", desc:"طلبہ کی روزانہ حاضری اور حاضری رپورٹس کا نظام یہاں تیار ہوگا۔" },
      { id:"att-teachers",   label:"اساتذہ کی حاضری",  icon:"clockCheck", desc:"اساتذہ کی حاضری اور تدریسی اوقات کا ریکارڈ یہاں ہوگا۔" },
      { id:"academic",       label:"تعلیمی ریکارڈ",    icon:"book",     desc:"اسباق کی پیش رفت اور تعلیمی کارکردگی کا ریکارڈ یہاں محفوظ ہوگا۔" },
      { id:"exams",          label:"امتحانات اور نتائج", icon:"award",   desc:"امتحانات، نمبرات، درجات اور پوزیشنوں کا مکمل نظام یہاں ہوگا۔" }
    ]},
    { id:"fin", title:"مالیاتی شعبہ", icon:"coins", layout:"c5", modules:[
      { id:"income",         label:"آمدنی کا ریکارڈ",   icon:"income",   desc:"مدرسے کی تمام آمدنی اور رسیدوں کا ریکارڈ یہاں محفوظ ہوگا۔" },
      { id:"expenses",       label:"اخراجات کا ریکارڈ", icon:"expense",  desc:"تمام اخراجات کی تفصیل اور واؤچرز کا ریکارڈ یہاں ہوگا۔" },
      { id:"monthly",        label:"ماہانہ حسابات",    icon:"monthCalc", desc:"ہر مہینے کی آمدنی و اخراجات کا خلاصہ اور بندش یہاں دیکھی جا سکے گی۔" },
      { id:"yearly",         label:"سالانہ حسابات",    icon:"yearChart", desc:"سال بھر کے مالی حسابات اور سالانہ خلاصہ یہاں تیار ہوگا۔" },
      { id:"zakat",          label:"زکوٰۃ",             icon:"zakat",    desc:"زکوٰۃ کی وصولی اور مستحقین تک تقسیم کا الگ ریکارڈ یہاں ہوگا۔" },
      { id:"donations",      label:"صدقات اور عطیات",  icon:"gift",     desc:"صدقات، عطیات اور عطیہ دہندگان کا ریکارڈ یہاں محفوظ ہوگا۔" },
      { id:"welfare",        label:"وظائف اور مالی معاونت", icon:"support", desc:"مستحق طلبہ کے وظائف اور مالی معاونت کا ریکارڈ یہاں ہوگا۔" },
      { id:"student-exp",    label:"طلبہ کے اخراجات", icon:"studentExpense", desc:"فی طالبہ اخراجات اور ان کی تفصیل کا حساب یہاں ہوگا۔" },
      { id:"fin-reports",    label:"مالیاتی رپورٹس",  icon:"report",   desc:"آمدنی، اخراجات اور بیلنس کی مکمل مالیاتی رپورٹس یہاں تیار ہوں گی۔" }
    ]},
    { id:"admin", title:"انتظامی شعبہ", icon:"building", layout:"c3", modules:[
      { id:"general",        label:"مدرسے کا عمومی ریکارڈ", icon:"general", desc:"مدرسے کی بنیادی معلومات اور عمومی دفتری ریکارڈ یہاں ہوگا۔" },
      { id:"users",          label:"صارفین اور اکاؤنٹس", icon:"users",   desc:"نظام استعمال کرنے والے تمام صارفین کے اکاؤنٹس کا انتظام یہاں ہوگا۔" },
      { id:"permissions",    label:"اختیارات اور اجازتیں", icon:"shield", desc:"ہر صارف کے اختیارات اور شعبہ جات تک رسائی کی اجازتیں یہاں مقرر ہوں گی۔" },
      { id:"notices",        label:"اطلاعات اور اعلانات", icon:"bell",   desc:"مدرسے کی اطلاعات، اعلانات اور تعطیلات کا ریکارڈ یہاں ہوگا۔" },
      { id:"documents",      label:"دستاویزات",         icon:"folder",   desc:"سرکاری دستاویزات اور فائلوں کا محفوظ ریکارڈ یہاں ہوگا۔" },
      { id:"reports",        label:"رپورٹس",            icon:"report",   desc:"مختلف شعبوں کی مجموعی رپورٹس یہاں تیار اور پرنٹ کی جا سکیں گی۔" }
    ]},
    { id:"other", title:"دیگر سہولیات", icon:"settings", layout:"c1", modules:[
      { id:"backup",         label:"بیک اپ",             icon:"backup",   desc:"تمام ڈیٹا کا محفوظ بیک اپ اور بحالی کی سہولت یہاں ہوگی۔" },
      { id:"settings",       label:"نظام کی ترتیبات",  icon:"settings", desc:"مدرسے کا نام، لوگو اور نظام کی عمومی ترتیبات یہاں بدلی جا سکیں گی۔" }
    ]}
  ];

  var STATS = [
    { label:"کل طلبہ",        icon:"users",    note:"ریکارڈ ابھی خالی ہے" },
    { label:"کل اساتذہ",      icon:"teacher",  note:"ریکارڈ ابھی خالی ہے" },
    { label:"آج کی حاضری",   icon:"checkCal", note:"حاضری ابھی درج نہیں" },
    { label:"موجودہ مالی بیلنس", icon:"wallet", note:"حساب ابھی خالی ہے" }
  ];

  var byId = {};
  GROUPS.forEach(function(g){ g.modules.forEach(function(m){ m.group = g.title; byId[m.id] = m; }); });
  byId["profile"] = { id:"profile", label:"میرا پروفائل", icon:"users", group:"اکاؤنٹ", desc:"" };

  /* ---------- Render stats (empty state: zero) ---------- */
  var zero = (0).toLocaleString("ur-PK");
  document.getElementById("statsRow").innerHTML = STATS.map(function(s){
    return '<div class="stat"><div class="sic">' + I[s.icon] + '</div><div>' +
      '<div class="slabel">' + s.label + '</div>' +
      '<div class="svalue">' + zero + '</div>' +
      '<div class="snote">' + s.note + '</div></div></div>';
  }).join("");

  /* ---------- Render groups & tiles ---------- */
  function tileHTML(m){
    return '<button type="button" class="tile" data-open="' + m.id + '">' +
      '<span class="tic">' + I[m.icon] + '</span>' +
      '<span class="tlabel">' + m.label + '</span>' +
      '<span class="chev">' + I.chev + '</span></button>';
  }
  function groupHTML(g, layoutClass){
    return '<section class="group" aria-label="' + g.title + '">' +
      '<div class="g-head"><span class="g-ic">' + I[g.icon] + '</span><h2>' + g.title + '</h2></div>' +
      '<div class="tiles ' + layoutClass + '">' + g.modules.map(tileHTML).join("") + '</div></section>';
  }
  var root = document.getElementById("groupsRoot");
  root.innerHTML =
    groupHTML(GROUPS[0], "c5") +
    groupHTML(GROUPS[1], "c5") +
    '<div class="split"><div>' + groupHTML(GROUPS[2], "c3") + '</div><div>' + groupHTML(GROUPS[3], "c1") + '</div></div>';

  /* ---------- Dates ---------- */
  try {
    var now = new Date();
    document.getElementById("dateGregorian").textContent =
      new Intl.DateTimeFormat("ur-PK", { weekday:"long", day:"numeric", month:"long", year:"numeric" }).format(now);
    document.getElementById("dateHijri").textContent =
      new Intl.DateTimeFormat("ur-PK-u-ca-islamic", { day:"numeric", month:"long", year:"numeric" }).format(now);
  } catch(e){ /* date stays as placeholder if Intl is unavailable */ }

  /* ---------- Navigation ---------- */
  var dash = document.getElementById("dashboardView");
  var mod = document.getElementById("moduleView");

  function openModule(id){
    var m = byId[id]; if(!m) return;
    document.getElementById("modIcon").innerHTML = I[m.icon] || I.book;
    document.getElementById("modGroup").textContent = m.group;
    document.getElementById("modTitle").textContent = m.label;
    document.getElementById("modDesc").textContent = m.desc;
    var extra = document.getElementById("modExtra");
    if(id === "profile"){
      extra.innerHTML = '<div class="profile-rows">' +
        '<div class="row"><span>نام</span><span>حمید</span></div>' +
        '<div class="row"><span>عہدہ</span><span>سپر ایڈمن</span></div>' +
        '<div class="row"><span>ادارہ</span><span>مدرسہ سیدہ عائشہ صدیقہ (رضی اللہ عنہا) للبنات</span></div></div>';
    } else { extra.innerHTML = ""; }
    dash.style.display = "none";
    mod.classList.add("open");
    window.scrollTo(0,0);
    try { history.replaceState(null,"", "#/" + id); } catch(e){}
  }
  function showDashboard(){
    mod.classList.remove("open");
    dash.style.display = "";
    window.scrollTo(0,0);
    try { history.replaceState(null,"", "#/"); } catch(e){}
  }
  document.addEventListener("click", function(ev){
    var t = ev.target.closest("[data-open]");
    if(t){ closeMenus(); openModule(t.getAttribute("data-open")); }
  });
  document.getElementById("backBtn").addEventListener("click", showDashboard);

  /* ---------- Dropdown menus ---------- */
  var bellMenu = document.getElementById("bellMenu");
  var userMenu = document.getElementById("userMenu");
  function closeMenus(){ bellMenu.classList.remove("open"); userMenu.classList.remove("open"); }
  document.getElementById("bellBtn").addEventListener("click", function(ev){
    ev.stopPropagation();
    var was = bellMenu.classList.contains("open"); closeMenus();
    if(!was) bellMenu.classList.add("open");
  });
  document.getElementById("userBtn").addEventListener("click", function(ev){
    ev.stopPropagation();
    var was = userMenu.classList.contains("open"); closeMenus();
    if(!was) userMenu.classList.add("open");
  });
  bellMenu.addEventListener("click", function(ev){ ev.stopPropagation(); });
  userMenu.addEventListener("click", function(ev){ ev.stopPropagation(); });
  document.addEventListener("click", closeMenus);
  document.addEventListener("keydown", function(ev){ if(ev.key === "Escape"){ closeMenus(); } });

  /* Restore module from hash on load */
  if(location.hash && location.hash.indexOf("#/") === 0){
    var hid = location.hash.slice(2);
    if(byId[hid]) openModule(hid);
  }
})();
</script>
